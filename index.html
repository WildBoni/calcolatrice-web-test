<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calcolatrice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calcolatrice">
        <output id="display" class="display" aria-live="polite">0</output>
        <div class="tasti">
            <button type="button" class="azione larga-3" data-azione="cancella">C</button>
            <button type="button" class="operatore" data-operatore="/" aria-label="Diviso">÷</button>

            <button type="button" data-cifra="7">7</button>
            <button type="button" data-cifra="8">8</button>
            <button type="button" data-cifra="9">9</button>
            <button type="button" class="operatore" data-operatore="*" aria-label="Per">×</button>

            <button type="button" data-cifra="4">4</button>
            <button type="button" data-cifra="5">5</button>
            <button type="button" data-cifra="6">6</button>
            <button type="button" class="operatore" data-operatore="-" aria-label="Meno">−</button>

            <button type="button" data-cifra="1">1</button>
            <button type="button" data-cifra="2">2</button>
            <button type="button" data-cifra="3">3</button>
            <button type="button" class="operatore" data-operatore="+" aria-label="Più">+</button>

            <button type="button" class="larga-2" data-cifra="0">0</button>
            <button type="button" data-azione="punto" aria-label="Virgola">.</button>
            <button type="button" class="operatore" data-azione="uguale" aria-label="Uguale">=</button>
        </div>
    </main>
    <script src="esempio.js"></script>
    <script src="app.js"></script>
</body>
</html>
